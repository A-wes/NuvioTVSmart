server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Rewritten on every container start, so it must never be cached anywhere.
    location = /nuvio.env.js {
        add_header Cache-Control "no-store" always;
    }

    # Written next to nuvio.env.js by the same entrypoint; reports what the app was configured
    # with, so an uptime check can tell "serving" apart from "serving, but unconfigured".
    location = /.well-known/nuvio-web {
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # index.html points at hashless bundle names, so it must be revalidated too.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
